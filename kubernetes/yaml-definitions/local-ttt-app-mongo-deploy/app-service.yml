# Exposes the app outside the cluster on port 30001
apiVersion: v1
kind: Service
metadata:
  name: tttapp-service
spec:
  type: NodePort
  selector:
    app: tttapp  # connects this Service to the app pods
  ports:
  - port: 80          # the Service's port inside the cluster
    targetPort: 3000  # the app's port in the container
    nodePort: 30001   # open http://localhost:30001 (range 30000-32767)
