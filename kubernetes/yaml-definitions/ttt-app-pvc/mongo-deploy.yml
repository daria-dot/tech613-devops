
apiVersion: v1
kind: PersistentVolumeClaim  # storage that survives pod restarts
metadata:
  name: mongo-pvc
spec:
  accessModes:
  - ReadWriteOnce  
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-deployment
spec:
  replicas: 1  
  strategy:
    type: Recreate  
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
      - name: mongo
        image: mongo:7.0  # official image from Docker Hub
        ports:
        - containerPort: 27017  # MongoDB's default port
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db  # where Mongo stores its data
        readinessProbe:  
          exec:
            command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 10  
      volumes:
      - name: mongo-data
        persistentVolumeClaim:
          claimName: mongo-pvc
