# Tic-tac-toe app, connected to MongoDB, scaled by the HPA (2-10 replicas)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tttapp-deployment
spec:
  
  selector:
    matchLabels:
      app: tttapp  
  template:
    metadata:
      labels:
        app: tttapp
    spec:
      initContainers:  
      - name: wait-for-mongo
        image: busybox:1.36
        command: ["sh", "-c", "until nc -z mongo-service 27017; do echo waiting for mongo; sleep 2; done"]
      containers:
      - name: tttapp
        image: dashaneuro/tech613-tttapp:1.2.0  # my image on Docker Hub
        ports:
        - containerPort: 3000  
        env:
        - name: MONGODB_URI
          value: mongodb://mongo-service:27017/tictactoe  
        resources:
          requests:
            cpu: 50m       
            memory: 64Mi
          limits:
            cpu: 200m       
            memory: 256Mi
