apiVersion: v1
kind: Service
metadata:
  name: tttapp-service
  namespace: default  # auto applied
spec:
  ports:
  - nodePort: 30001 # range is 30000-32768  # node port
    port: 80
    targetPort: 3000

  selector:
    app: tttapp  # this label connect this service to the deployment

  type: NodePort  # also use LoadBalancer - for local use cluster IP